<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Nagauri Brands</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <div class="max-w-4xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-8 text-center">Your Cart</h1>
    
    <div id="cartItems" class="space-y-6"></div>

    <div class="mt-12 bg-white p-8 rounded-3xl shadow">
      <div class="flex justify-between text-2xl font-semibold">
        <span>Total Amount</span>
        <span>₹<span id="totalPrice">0</span></span>
      </div>
      <button onclick="checkout()" 
              class="w-full mt-8 bg-gradient-to-r from-pink-600 to-blue-600 text-white py-5 rounded-2xl text-xl font-medium">
        Proceed to Checkout
      </button>
    </div>

    <a href="index.html" class="block text-center mt-6 text-indigo-600 hover:underline">← Continue Shopping</a>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
