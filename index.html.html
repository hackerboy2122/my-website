<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagauri Brands - Ecommerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header -->
  <header class="bg-gradient-to-r from-pink-600 to-blue-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Nagauri Brands" class="h-14 w-auto">
      </div>
      
      <div class="flex items-center gap-6">
        <input type="text" id="searchInput" 
               class="border border-white/30 bg-white/20 text-white px-5 py-3 w-80 rounded-full focus:outline-none placeholder-white/70"
               placeholder="Search products...">
        
        <button onclick="toggleCart()" class="relative text-3xl hover:scale-110 transition">
          🛒 
          <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-10">
    <h2 class="text-4xl font-bold text-center mb-10 text-gray-800">Our Collection</h2>
    
    <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
